{{- $r := site.Data.relations -}}
<section class="panel is-hidden" id="panel-relations" role="tabpanel" aria-label="Relations">
  <article class="card">
    <div class="card-head">
      <div>
        <h2 class="card-title">{{ $r.chainsSection.title }}</h2>
        <div class="card-note prose" id="relationsIntro"></div>
      </div>
      <div class="graph-legend" id="graphLegend"></div>
    </div>

    <div class="graph-holder" id="graphHolder">
      <div class="graph-toolbar">
        <div class="segmented" id="graphModes" role="tablist" aria-label="Layout">
          <button type="button" class="segment is-active" role="tab" aria-selected="true" data-mode="network" aria-controls="relationsNetwork">Selected set graph</button>
          <button type="button" class="segment" role="tab" aria-selected="false" data-mode="chains" aria-controls="relationsChains">Compact chains</button>
        </div>
        <div class="graph-find">
          <label class="visually-hidden" for="notionSearch">Find a notion</label>
          <input id="notionSearch" class="text-input" list="notionList" placeholder="Find a notion" autocomplete="off" spellcheck="false">
          <datalist id="notionList"></datalist>
        </div>
        <button type="button" class="btn" id="graphReset">Reset view</button>
        <button type="button" class="btn" id="graphFullscreen" aria-pressed="false">
          <svg class="icon" viewBox="0 0 24 24" aria-hidden="true"><path d="M9 4H4v5M15 4h5v5M9 20H4v-5M15 20h5v-5"/></svg>Fullscreen</button>
        <button type="button" class="btn is-hidden" id="graphFullscreenExit">
          <svg class="icon" viewBox="0 0 24 24" aria-hidden="true"><path d="M4 9h5V4M20 9h-5V4M4 15h5v5M20 15h-5v5"/></svg>Exit fullscreen</button>
      </div>

      <div class="graph-stage is-network" id="relationsNetwork" role="img" aria-label="{{ $r.chainsSection.title }}"></div>
      <div class="graph-stage is-chains is-hidden" id="relationsChains"></div>
      <div class="graph-zoom" id="graphZoom">
        <button type="button" class="graph-zoom-btn" data-zoom="in" aria-label="Zoom in">+</button>
        <button type="button" class="graph-zoom-btn" data-zoom="out" aria-label="Zoom out">&minus;</button>
      </div>
    </div>

    <nav class="rel-path" id="relationsTrail" aria-label="Visited notions"></nav>

    <div class="rel-steps" id="relationsSteps"></div>
    <p class="graph-caption prose" id="relationsClosing"></p>
    <div class="theorem-grid" id="relationsTheorems"></div>
  </article>

  <article class="card">
    <h2 class="card-title">{{ $r.selection.title }}</h2>
    <div id="relationsSelection"></div>
  </article>

  <article class="card" id="beyondCard">
    <h2 class="card-title">{{ $r.beyond.title }}</h2>
    <div class="card-note prose" id="beyondLead"></div>
    <div class="theorem-grid" id="beyondTheorems"></div>
  </article>

  <article class="card" id="compilersCard">
    <h2 class="card-title">{{ $r.compilers.title }}</h2>
    <div class="card-note prose" id="compilersLead"></div>
    <div class="theorem-grid" id="compilersTheorems"></div>
  </article>

  <article class="card" id="additionalCard">
    <h2 class="card-title">{{ $r.additional.title }}</h2>
    <div class="card-note prose" id="additionalLead"></div>
    <div class="theorem-grid" id="additionalTheorems"></div>
  </article>
</section>
