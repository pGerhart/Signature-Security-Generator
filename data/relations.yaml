intro:
  - 'A composed notion consists of exactly one unforgeability goal, at most one exclusive-ownership goal, optional message bounding and non-resignability, and an adversary model $\mathsf{am}=(\mathsf{mc},\mathsf{rc},\mathsf{kc})$ with message choice $\mathsf{mc}$, randomness choice $\mathsf{rc}$, and key exposure $\mathsf{kc}\in\{L_{\mathsf{tsk}},\emptyset\}$.'
  - 'We write $(\mathsf{sg},\mathsf{am})\rightarrow(\mathsf{sg}'',\mathsf{am}'')$ if every $(\mathsf{sg},\mathsf{am})$-secure scheme is also $(\mathsf{sg}'',\mathsf{am}'')$-secure, and $(\mathsf{sg},\mathsf{am})\not\rightarrow(\mathsf{sg}'',\mathsf{am}'')$ if some scheme separates the two. UKE remains available in generated definitions but is omitted here because it only adds the straightforward restriction order $\emptyset\rightarrow\mathrm{UKE}$.'

chainsSection:
  title: 'Security Goal and Attack Vector Relations'
  lead: 'The compact chains show the unforgeability, exclusive-ownership, and attack-vector relations. The selected-set graph combines them and treats all selected goals as a set.'
  note: 'These implication chains determine the relations between composed notions:'
  closing: 'These chains show the component-wise implications. An exhaustive classification of additional relations in the extended framework is outside the scope of the paper.'

classical:
  intro:
    - 'A classical security definition $\mathsf{sd}=(\mathsf{sg},\mathsf{am})$ pairs one unforgeability goal $\mathsf{sg}$ with one adversary model $\mathsf{am}\in\{\mathrm{KOA},\mathrm{KMA},\mathrm{gCMA},\mathrm{dCMA},\mathrm{aCMA}\}$. The randomness choice, key exposure, and the goals beyond unforgeability are what the extended framework adds.'
    - 'Throughout, $\mathsf{sd}\rightarrow\mathsf{sd}''$ means that every $\mathsf{sd}$-secure scheme is $\mathsf{sd}''$-secure, whereas we show $\mathsf{sd}\not\rightarrow\mathsf{sd}''$ with a separating example.'
  lead: 'We first revisit the classical view of signature security, including its two-dimensional relation grid. The compact chains show the security goal order and the adversary model order; the selected-set graph is their product.'
  closing: 'This covers all directions in the classical relation grid and proves that no further implication exists.'
  rule: 'In the classical framework, for $\mathsf{am}_s,\mathsf{am}_w\neq\mathrm{KOA}$, $\mathsf{sd}_s=(\mathsf{sg}_s,\mathsf{am}_s)$ implies $\mathsf{sd}_w=(\mathsf{sg}_w,\mathsf{am}_w)$ if and only if $\mathsf{sg}_s\rightarrow\mathsf{sg}_w$ and $\mathsf{am}_s\rightarrow\mathsf{am}_w$. At $\mathrm{KOA}$, $\mathrm{sEUF}$, $\mathrm{wEUF}$, and $\mathrm{sSUF}$ describe the same experiment.'
  chainNote: 'We simulate an adversary against $(\mathsf{sg}_w,\mathsf{am}_w)$ in the $(\mathsf{sg}_s,\mathsf{am}_s)$ experiment. The stronger adversary model answers every query of the weaker one, and every output that wins the weaker goal also wins the stricter one.'
  noStrongerNote: 'No further relation holds.'
  koaNote: 'Under $\mathrm{KOA}$, the signing oracle is empty. Hence, the adversary chooses the message after receiving $\mathsf{pk}$ without subsequently learning a signature in each of the $\mathrm{sEUF}$, $\mathrm{wEUF}$, and $\mathrm{sSUF}$ experiments. Since the queue is empty, pair freshness and message freshness are also equivalent.'
  theorems:
    - id: 'lem:classical-sec-def-relations'
      name: 'Lemma'
      statement: 'All classical relations between two security definitions $\mathsf{sd}_s=(\mathsf{sg}_s,\mathsf{am}_s)$ and $\mathsf{sd}_w=(\mathsf{sg}_w,\mathsf{am}_w)$ are generated by $\mathsf{sg}_s\rightarrow\mathsf{sg}_w$ and $\mathsf{am}_s\rightarrow\mathsf{am}_w$, together with $(\mathrm{sEUF},\mathrm{KOA})\Leftrightarrow(\mathrm{wEUF},\mathrm{KOA})\Leftrightarrow(\mathrm{sSUF},\mathrm{KOA})$. No further relation holds.'
      note: 'The additional equivalence handles the boundary case of the original analysis. It also explains relations such as $(\mathrm{sSUF},\mathrm{KMA})\rightarrow(\mathrm{sEUF},\mathrm{KOA})$: first, $\mathrm{KMA}\rightarrow\mathrm{KOA}$; then, $(\mathrm{sSUF},\mathrm{KOA})$ and $(\mathrm{sEUF},\mathrm{KOA})$ are the same experiment.'

legend:
  implication: 'implication'
  separation: 'reverse direction'
  equivalence: 'equivalence'
  compiler: 'compiler'

legendTips:
  implication: 'We write $(\mathsf{sg},\mathsf{am})\rightarrow(\mathsf{sg}'',\mathsf{am}'')$ if every $(\mathsf{sg},\mathsf{am})$-secure scheme is also $(\mathsf{sg}'',\mathsf{am}'')$-secure.'
  separation: 'A reverse separation is asserted only where the paper gives a separating example; the extended component-wise theorem is not an exhaustive classification.'
  equivalence: 'Two nodes are equivalent if they induce the same security requirement, including conjunctions and components unused by the experiment.'
  compiler: 'A compiler edge leads from the notion that a scheme $\Sigma$ achieves to the notion that the compiled scheme achieves under the assumptions of the named theorem. Unlike an implication, it relates two different schemes.'

lanes:
  - id: goal
    axis: goal
    title: 'Security goal'
    nodes: [seuf, weuf, ssuf, wsuf, uuf, ub]
    lemma: 'lem:goal-order'
  - id: message
    axis: message
    title: 'Message choice'
    nodes: [acma, dcma, gcma, kma, koa]
    lemma: 'lem:model-order'
  - id: randomness
    axis: randomness
    title: 'Randomness choice'
    nodes: [acra, dcra, gcra, kra, rkoa]
    lemma: 'lem:model-order'
  - id: exposure
    axis: exposure
    title: 'Key exposure'
    nodes: [ltsk, empty]
    lemma: 'lem:goal-order'

goalLanes:
  - id: ownershipMalicious
    title: 'Malicious to universal ownership'
    nodes: [msueo, sueo]
  - id: ownershipUniversal
    title: 'Strong to weak universal ownership'
    nodes: [sueo, wueo]
  - id: ownershipConservative
    title: 'Strong to weak conservative ownership'
    nodes: [sceo, wceo]
  - id: ownershipDestructive
    title: 'Strong to weak destructive ownership'
    nodes: [sdeo, wdeo]

nodes:
  seuf:  {acr: 'sEUF',  label: 'Strong Existential Unforgeability', bind: {classicalGoal: seuf, extendedUnforgeability: seuf}}
  weuf:  {acr: 'wEUF',  label: 'Weak Existential Unforgeability',   bind: {classicalGoal: weuf, extendedUnforgeability: weuf}}
  ssuf:  {acr: 'sSUF',  label: 'Strong Selective Unforgeability',   bind: {classicalGoal: ssuf, extendedUnforgeability: ssuf}}
  wsuf:  {acr: 'wSUF',  label: 'Weak Selective Unforgeability',     bind: {classicalGoal: wsuf, extendedUnforgeability: wsuf}}
  uuf:   {acr: 'UUF',   label: 'Universal Unforgeability',          bind: {classicalGoal: uuf,  extendedUnforgeability: uuf}}
  ub:    {acr: 'UB',    label: 'Unbreakability',                    bind: {classicalGoal: ub,   extendedUnforgeability: ub}}
  acma:  {acr: 'aCMA',  label: 'Adaptive Chosen Message Attack',    bind: {classicalModel: acma, messageChoice: acm}}
  dcma:  {acr: 'dCMA',  label: 'Direct Chosen Message Attack',      bind: {classicalModel: dcma, messageChoice: dcm}}
  gcma:  {acr: 'gCMA',  label: 'Generic Chosen Message Attack',     bind: {classicalModel: gcma, messageChoice: gcm}}
  kma:   {acr: 'KMA',   label: 'Known Message Attack',              bind: {classicalModel: kma,  messageChoice: km}}
  koa:   {acr: 'KOA',   label: 'Key Only Attack',                   bind: {classicalModel: koa,  messageChoice: ko}}
  acra:  {acr: 'aCRA',  label: 'Adaptive Chosen Randomness',        bind: {randomnessChoice: acr}}
  dcra:  {acr: 'dCRA',  label: 'Direct Chosen Randomness',          bind: {randomnessChoice: dcr}}
  gcra:  {acr: 'gCRA',  label: 'Generic Chosen Randomness',         bind: {randomnessChoice: gcr}}
  kra:   {acr: 'KRA',   label: 'Known Randomness Sampling',         bind: {randomnessChoice: kr}}
  rkoa:  {acr: 'KOA',   label: 'No Randomness Choice',              bind: {randomnessChoice: ko}}
  ltsk:  {acr: 'L', sub: 'tsk', label: 'Include Leakage Function',  bind: {leakage: true}}
  empty: {acr: '∅', glyph: emptyset, label: 'None',                             bind: {leakage: false}}
  msueo: {acr: 'msUEO', label: 'Malicious Strong Universal Exclusive Ownership'}
  sueo:  {acr: 'sUEO',  label: 'Strong Universal Exclusive Ownership'}
  wueo:  {acr: 'wUEO',  label: 'Weak Universal Exclusive Ownership'}
  sceo:  {acr: 'sCEO',  label: 'Strong Conservative Exclusive Ownership'}
  wceo:  {acr: 'wCEO',  label: 'Weak Conservative Exclusive Ownership'}
  sdeo:  {acr: 'sDEO',  label: 'Strong Destructive Exclusive Ownership'}
  wdeo:  {acr: 'wDEO',  label: 'Weak Destructive Exclusive Ownership'}
  mb:    {acr: 'MB',    label: 'Message Bounding'}
  nr:    {acr: 'NR',    label: 'Non-Resignability'}

goalImplications:
  - {from: seuf, to: weuf}
  - {from: weuf, to: ssuf}
  - {from: ssuf, to: wsuf}
  - {from: wsuf, to: uuf}
  - {from: uuf, to: ub}
  - {from: msueo, to: sueo}
  - {from: sceo, to: wceo}
  - {from: sdeo, to: wdeo}
  - {from: sueo, to: wueo}
  - {from: sueo, to: sceo}
  - {from: sueo, to: sdeo}
  - {from: wueo, to: wceo}
  - {from: wueo, to: wdeo}

goalEquivalences:
  - {single: sueo, conjunction: [sceo, sdeo]}
  - {single: wueo, conjunction: [wceo, wdeo]}

edges:
  - from: seuf
    to: weuf
    impl: 'If $\mathcal{A}$ can compute a new valid signature for a chosen message that does not already have a signature, $\mathcal{A}$ implicitly can break $\mathrm{sEUF}$ because this also fulfills the condition for breaking $\mathrm{sEUF}$.'
    sep: 'Appending a verifier-ignored bit to every signature separates $\mathrm{wEUF}$ from $\mathrm{sEUF}$.'
  - from: weuf
    to: ssuf
    impl: 'If $\mathcal{A}$ can compute a new valid signature for an a priori chosen message, $\mathcal{A}$ can do the same for a message chosen at any time since a priori is a special case of arbitrary choice.'
    sep: 'To separate $\mathrm{sSUF}$ from $\mathrm{wEUF}$, assume that every signature contains a random value $x$ and that verification additionally accepts this signature for message $x$. After one signing query, a $\mathrm{wEUF}$ adversary chooses the received $x$ as its forgery message. In contrast, an $\mathrm{sSUF}$ adversary has to choose its forgery message before receiving $x$ and guesses this value only with negligible probability.'
  - from: ssuf
    to: wsuf
    impl: 'If $\mathcal{A}$ can compute a new valid signature for a message chosen before acquiring $\mathsf{pk}$, $\mathcal{A}$ can do the same after seeing $\mathsf{pk}$ since $\mathcal{A}$ implicitly does not need this knowledge.'
    sep: 'Embedding a uniformly sampled message in the public key for which a fixed string verifies separates $\mathrm{wSUF}$ from $\mathrm{sSUF}$.'
  - from: wsuf
    to: uuf
    impl: 'An adversary against $\mathrm{UUF}$ receives a target sampled according to $\mathcal{D}_M$. An adversary against $\mathrm{wSUF}$ can sample the same target before key generation and is therefore at least as powerful.'
    sep: 'Using instead a fixed message that $\mathcal{D}_M$ outputs only with negligible probability separates $\mathrm{UUF}$ from $\mathrm{wSUF}$.'
  - from: uuf
    to: ub
    impl: 'If $\mathcal{A}$ has access to a secret key matching $\mathsf{pk}$ and therefore is able to break $\mathrm{UB}$, $\mathcal{A}$ can also break $\mathrm{UUF}$ by using this key to compute a signature for the sampled target message.'
    sep: 'Finally, modifying verification to accept a fixed signature for every message leaves recovery of a matching secret key hard while destroying universal unforgeability, which separates $\mathrm{UB}$ from $\mathrm{UUF}$.'
  - from: acma
    to: dcma
    impl: 'An adversary with adaptive choice can simulate direct choice by fixing all parameters after receiving $\mathsf{pk}$ and keeping these choices while interacting with the oracle.'
    sep: 'Finally, the first signature may determine the unique second message on which signing reveals the key, separating $\mathrm{dCMA}$ from $\mathrm{aCMA}$.'
  - from: dcma
    to: gcma
    impl: 'An adversary with direct choice can simulate generic choice by selecting the parameters without using $\mathsf{pk}$ and keeping these choices after receiving $\mathsf{pk}$.'
    sep: 'Key generation may embed in $\mathsf{pk}$ a random message on which signing reveals the key, separating $\mathrm{gCMA}$ from $\mathrm{dCMA}$.'
  - from: gcma
    to: kma
    impl: '$\mathrm{gCMA}$ can simulate $\mathrm{KMA}$ because $\mathrm{KMA}$ is a special case of $\mathrm{gCMA}$, where the adversary chooses the messages according to the distribution $\mathcal{D}_M$ on which the experiment is defined.'
    sep: 'Signing a fixed message that $\mathcal{D}_M$ outputs only with negligible probability may reveal the signing key, separating $\mathrm{KMA}$ from $\mathrm{gCMA}$.'
  - from: kma
    to: koa
    impl: '$\mathrm{KMA}$ can simulate $\mathrm{KOA}$ because $\mathrm{KOA}$ is a special case of $\mathrm{KMA}$, where the adversary does not query the signing oracle.'
    sep: 'To separate $\mathrm{KOA}$ from $\mathrm{KMA}$, let the signing algorithm additionally output the signing key and let verification ignore this additional value. A $\mathrm{KMA}$ adversary receives the key with its first signature, while a $\mathrm{KOA}$ adversary has no access to the signing oracle.'
  - from: acra
    to: dcra
    impl: 'An adversary with adaptive choice fixes all its randomness values in advance and simulates direct choice.'
    sep: 'We reuse the schemes of the classical lemma and let the signing algorithm reveal $\mathsf{sk}$, this time not for one fixed message but for one fixed randomness value. Key generation may put such a value into $\mathsf{pk}$, which separates $\mathrm{gCRA}$ from $\mathrm{dCRA}$, and the first signature may fix the unique second value, which separates $\mathrm{dCRA}$ from $\mathrm{aCRA}$.'
  - from: dcra
    to: gcra
    impl: 'An adversary with direct choice selects these values without looking at $\mathsf{pk}$ and simulates generic choice.'
    sep: 'We reuse the schemes of the classical lemma and let the signing algorithm reveal $\mathsf{sk}$, this time not for one fixed message but for one fixed randomness value. Key generation may put such a value into $\mathsf{pk}$, which separates $\mathrm{gCRA}$ from $\mathrm{dCRA}$, and the first signature may fix the unique second value, which separates $\mathrm{dCRA}$ from $\mathrm{aCRA}$.'
  - from: gcra
    to: kra
    impl: 'An adversary with generic choice samples them like the experiment and simulates $\mathrm{KRA}$, and a $\mathrm{KRA}$ adversary ignores what it learns and simulates $\mathrm{KOA}$.'
    sep: 'Signing with a value of $r$ that $\mathcal{D}_R$ outputs only with negligible probability separates $\mathrm{KRA}$ from $\mathrm{gCRA}$.'
  - from: kra
    to: rkoa
    impl: 'An adversary with generic choice samples them like the experiment and simulates $\mathrm{KRA}$, and a $\mathrm{KRA}$ adversary ignores what it learns and simulates $\mathrm{KOA}$.'
    sep: 'The step from $\mathrm{KOA}$ to $\mathrm{KRA}$ is different, because for a message choice other than $\mathrm{KO}$, a $\mathrm{KOA}$ adversary already has the signing oracle and only misses its randomness. Here we use Schnorr, where one known nonce reveals $\mathsf{sk}$. One nonce suffices to break it, because the randomness $r$ gives $\mathsf{sk}=(y-r)/c \bmod p$ whenever $c\neq 0$.'
  - from: ltsk
    to: empty
    impl: 'For key exposure, an adversary with the leakage oracle simulates one without it by never calling this exposure oracle.'
    sep: 'The other direction fails as soon as $\mathsf{GenTsk}$ is the identity function: then $\mathsf{tsk}=\mathsf{sk}$, and the leakage oracle hands out the secret key.'

theorems:
  - id: 'thm:sec_defs_relations'
    name: 'Theorem (Security Definition Relations)'
    statement: 'In the extended framework, let $\mathsf{sd}=(\mathsf{sg},u,\mathsf{am})$, where $\mathsf{sg}$ is a non-empty collection of security goals, the restriction $u\in\{\emptyset,\mathrm{UKE}\}$ is ordered by $\emptyset\rightarrow\mathrm{UKE}$, and $\mathsf{am}$ is an adversary model. Further, let $\mathsf{sg}^*$ be the closure of the entire set $\mathsf{sg}$ under the security goal relations, including implications that require several goals together, such as $\{\mathrm{sCEO},\mathrm{sDEO}\}\rightarrow\{\mathrm{sUEO}\}$. Then, for another valid extended definition $\mathsf{sd}''=(\mathsf{sg}'',u'',\mathsf{am}'')$, $\mathsf{sd}=(\mathsf{sg},u,\mathsf{am})$ implies $\mathsf{sd}''$ if $\mathsf{sg}''\subseteq\mathsf{sg}^*$, $u\rightarrow u''$, and $\mathsf{am}\rightarrow\mathsf{am}''$ in every attack vector.'
    note: 'For $\mathsf{mc}=\mathsf{rc}=\mathrm{KO}$, the queue stays empty. Then $\mathrm{sEUF}$ and $\mathrm{wEUF}$ describe the same experiment, none of the queue-based exclusive-ownership goals can be broken, and there is no temporary key that the adversary could leak. If additionally $\mathrm{NR}\notin\mathsf{sg}$, the adversary receives no signature at all, and $\mathrm{sSUF}$ describes the same experiment as well. If $\mathrm{NR}\in\mathsf{sg}$, the adversary receives the challenge signature after it has committed to its $\mathrm{sSUF}$ target, so we do not identify $\mathrm{sSUF}$ with the other two goals in this case.'
  - id: 'rem:marginal-not-joint'
    name: 'Remark (Joint Security Does Not Follow Trivially)'
    statement: 'Assume deterministic $\mathrm{wEUF}$-$\mathrm{aCMA}$-secure signature schemes exist. Then there is a signature scheme that is $\mathrm{wEUF}$-secure under $(\mathrm{aCMA},\mathrm{KO},\emptyset)$ and under $(\mathrm{KO},\mathrm{aCRA},\emptyset)$, but not under $(\mathrm{aCMA},\mathrm{aCRA},\emptyset)$.'
    note: 'Under $(\mathrm{aCMA},\mathrm{aCRA},\emptyset)$, however, $\mathcal{A}$ queries $(m,r)=(x,x)$ for an arbitrary $x$, gets $\mathsf{sk}$, and can then sign arbitrary messages breaking unforgeability.'
  - id: 'ex:incomparable'
    name: 'Incomparable attack vectors'
    statement: 'Within one attack vector, the models form a chain. Across two vectors, no such order exists, since each vector addresses a different variable. A scheme may therefore treat one variable with care and give the other one away, which makes the two models incomparable.'
    note: 'Hence, security for $(\mathrm{aCMA},\mathrm{KO})$ does not imply security for $(\mathrm{KO},\mathrm{KRA})$. For the other direction, take a deterministic scheme whose signing algorithm outputs $\mathsf{sk}$ for one fixed message $m_0$ that $\mathcal{D}_M$ outputs only with negligible probability.'
  - id: 'ex:schnorr-kra'
    name: 'Separating example (Schnorr)'
    statement: 'The Schnorr signature scheme is $\mathrm{sEUF}$-$\mathrm{aCMA}$-secure in the random oracle model and thus withstands every message choice. One nonce suffices to break it, because the randomness $r$ gives $\mathsf{sk}=(y-r)/c \bmod p$ whenever $c\neq 0$.'
    note: 'The step from $\mathrm{KOA}$ to $\mathrm{KRA}$ is different, because for a message choice other than $\mathrm{KO}$, a $\mathrm{KOA}$ adversary already has the signing oracle and only misses its randomness.'

beyond:
  title: 'Beyond Unforgeability under Bad Randomness'
  lead: 'The beyond-unforgeability goals were introduced under adaptive chosen messages. Our framework can also express them under the additional attack vectors. We focus on bad randomness here and discuss key exposure at the temporary-key level in the remark on key exposure and beyond-unforgeability.'
  theorems:
    - id: 'thm:eo-mb-robust'
      name: 'Theorem (Exclusive ownership and message bounding are randomness-robust)'
      statement: 'Under the assumptions of the BUFF transform of Cremers et al., the transform achieves malicious strong universal exclusive ownership $\mathrm{msUEO}$ and message bounding $\mathrm{MB}$ under adaptive chosen randomness.'
      note: 'Malicious strong universal exclusive ownership and message bounding only ask what the verification algorithm accepts for keys that the adversary chooses, and not how an honest signature was created. Consequently, both goals survive every randomness choice without needing any compiler. For arbitrary schemes, this does not carry over to the conservative, destructive, and universal variants, since their winning conditions involve honest signatures from the queue.'
    - id: 'thm:nr-fragile'
      name: 'Theorem (NR and bad randomness)'
      statement: 'Let $\Sigma$ be a $(\mathrm{NR},(\mathrm{aCMA},\mathrm{KOA}))$-secure signature scheme and let $G$ be a pseudorandom generator. Then there is a signature scheme $\Sigma''$ that is $(\mathrm{NR},(\mathrm{aCMA},\mathrm{KOA}))$-secure, but not $(\mathrm{NR},(\mathrm{aCMA},\mathrm{KRA}))$-secure, and hence $(\mathrm{NR},(\mathrm{aCMA},\mathrm{KOA}))\not\rightarrow(\mathrm{NR},(\mathrm{aCMA},\mathrm{KRA}))$.'
      note: 'We build a non-resignable scheme whose challenge signature carries the message under a mask derived from the signing randomness, so an adversary that merely learns this randomness recovers the message and re-signs it.'
    - id: 'thm:nr-hedge'
      name: 'Theorem (Randomness compiler restores non-resignability)'
      statement: 'Under the assumptions of Theorem (PRF Secures Against Bad Randomness), let $\Sigma$ be non-resignable under honest randomness. Then the compiled scheme $\mathsf{GenTr}(\Sigma)$ is non-resignable under adaptive chosen randomness.'
      note: 'The same hybrid covers $\mathrm{KRA}$, since there too $\mathsf{tr}$ remains secret.'
    - id: 'thm:buff-composes'
      name: 'Theorem (Composition with beyond-unforgeability)'
      statement: 'Let $T$ denote the BUFF transform of Cremers et al. Assume that $T(\Sigma)$ is non-resignable under honest randomness and that the assumptions of the two theorems above hold. Then $\mathsf{GenTr}(T(\Sigma))$ achieves $\mathrm{msUEO}$, $\mathrm{MB}$, and $\mathrm{NR}$ under $\mathrm{aCRA}$.'
      note: 'Note that $\mathrm{MB}$ does not even need the compiler: a break requires a collision $\mathsf{H}(m,\mathsf{pk})=\mathsf{H}(m'',\mathsf{pk})$, which does not involve the signing randomness. Only $\mathrm{NR}$ depends on it.'
    - id: 'rem:beyond-ke'
      name: 'Remark (Key exposure and beyond-unforgeability)'
      statement: 'We interpret the beyond-unforgeability goals under key exposure at the temporary-key level. The master key is trusted and used only to authenticate temporary verification keys; attacks concerning cross-key behaviour or information leakage at the master-key layer are outside our model.'
      note: 'At the temporary-key level, the exposure oracle returns keys only for queried message--signature pairs, while the $\mathrm{UKE}$ restriction excludes a winning output associated with an exposed temporary key. Consequently, the message-bounding argument remains unchanged, and the analyses of exclusive ownership and non-resignability reduce analogously to the corresponding experiments without key exposure.'

compilers:
  title: 'Security Compilers'
  lead: 'Our model utilizes the compilers $\mathsf{GenTr}$ to secure against bad randomness attacks and $\mathsf{GenTsk}$ to secure against key leakage.'
  explain: 'A compiler edge leads from the notion that a scheme $\Sigma$ achieves to the notion that the compiled scheme achieves under the assumptions of the named theorem. Unlike an implication, it relates two different schemes.'
  compiledFrom: 'Compiled from'
  compilesTo: 'Compiles to'
  rules:
    - id: gentr
      compiler: 'GenTr'
      theorem: 'lemma:prf_against_bad_randomness:main:body'
      goals: {excludes: [nr]}
      source: {message: acma, randomness: rkoa, exposure: empty}
      target: {message: acma, randomness: acra, exposure: empty}
      note: 'The theorem covers every goal whose winning condition depends on the oracle interaction only through the set $Q$ of queried input--output pairs, as for all goals except $\mathrm{NR}$.'
    - id: gentr-nr
      compiler: 'GenTr'
      theorem: 'thm:nr-hedge'
      goals: {requires: [nr]}
      source: {message: acma, randomness: rkoa, exposure: empty}
      target: {message: acma, randomness: acra, exposure: empty}
      note: 'For a goal set with $\mathrm{NR}$, the randomness compiler theorem covers the other goals, the theorem that the randomness compiler restores non-resignability covers $\mathrm{NR}$, and the proposition on adding non-resignability under adaptive message choice combines both within the goal set.'
    - id: gentsk
      compiler: 'GenTsk'
      theorem: 'thm:key:exposure:sec:compiler:merkle:tree:main:body'
      goals: {single: [seuf, weuf, ssuf, wsuf, uuf]}
      source: {message: acma, randomness: rkoa, exposure: empty}
      target: {message: acma, randomness: rkoa, exposure: ltsk}
      restriction: 'UKE'
      note: 'The compiled scheme satisfies the goal with the $\mathrm{UKE}$ restriction.'
    - id: composition
      compiler: 'GenTr and GenTsk'
      theorem: 'thm:wrappers-closure'
      goals: {single: [seuf, weuf, ssuf, wsuf, uuf]}
      source: {message: acma, randomness: rkoa, exposure: empty}
      target: {message: acma, randomness: acra, exposure: ltsk}
      restriction: 'UKE'
      note: 'Both orders satisfy the goal with the $\mathrm{UKE}$ restriction.'
  theorems:
    - id: 'lemma:prf_against_bad_randomness:main:body'
      name: 'Theorem (PRF Secures Against Bad Randomness)'
      statement: 'Let $\Pi=(\mathsf{A}_0,\ldots,\mathsf{A}_n)$ be a cryptographic scheme that satisfies a security goal $\mathsf{sg}$ against any $\mathsf{PPT}$ adversary $\mathcal{A}$ with adaptive chosen input $\mathrm{aCMA}$, where $\mathsf{GenTr}$ computes the identity function (i.e., $\mathsf{tr}=r$) and the experiment samples $r$ uniformly from $\mathcal{D}_R$ in every invocation without handing it to $\mathcal{A}$. Let $\mathsf{sg}$ be a goal whose winning condition depends on the oracle interaction only through the set $Q$ of queried input--output pairs, as for all goals except $\mathrm{NR}$. Let $F$ be a PRF. Let $\Pi''$ be the scheme whose secret key is $\mathsf{sk}=(\mathsf{sk}_1,\mathsf{sk}_2)$, where $\mathsf{sk}_1$ is an independent PRF key and $\mathsf{sk}_2$ is the secret key of $\Pi$, and in which $\mathsf{GenTr}$ computes the internal randomness as $\mathsf{tr}\gets F(\mathsf{sk}_1,m;r)$, which yields weak non-repeatability, or $\mathsf{tr}\gets F(\mathsf{sk}_1,m;r)$ under the assumption that $r$ is a nonce, or $\mathsf{tr}\gets F(\mathsf{sk}_1,\mathsf{ct},m;r)$ with a counter $\mathsf{ct}$ that $\mathsf{GenTr}$ increments after every invocation, where the last two options yield strong non-repeatability. Then, $\Pi''$ satisfies $\mathsf{sg}$ against any $\mathsf{PPT}$ adversary $\mathcal{A}$ with $\mathrm{aCMA}$ and adaptive chosen randomness $\mathrm{aCRA}$.'
      note: 'We distinguish between weak non-repeatability, where the output of the PRF is the same for multiple queries with the same input and randomness, and strong non-repeatability, where the output of the PRF is always unique.'
    - id: 'thm:key:exposure:sec:compiler:merkle:tree:main:body'
      name: 'Theorem (Merkle Tree Compiler)'
      statement: 'Let $\Pi=(\mathsf{A}_0,\mathsf{A}_1,\mathsf{A}_2)$ be a cryptographic scheme satisfying an unforgeability goal $\mathsf{sg}\in\{\mathrm{UUF},\mathrm{wSUF},\mathrm{sSUF},\mathrm{wEUF},\mathrm{sEUF}\}$ against any $\mathsf{PPT}$ adversary $\mathcal{A}$ with adaptive chosen input attack $\mathrm{aCMA}$ against algorithm $\mathsf{A}_1$ and corresponding public verification algorithm $\mathsf{A}_2$. Let $\Sigma$ be a $\mathrm{sEUF}$-$\mathrm{aCMA}$ secure signature scheme, and let $\mathsf{H}$ be a collision-resistant hash function, with which the Merkle tree is built using distinct prefixes for leaves and inner nodes. Let $\Pi''$ be the scheme obtained from $\Pi$ by applying the security compiler. Then, $\Pi''$ satisfies $\mathsf{sg}$ with $\mathrm{UKE}$ against any $\mathsf{PPT}$ adversary $\mathcal{A}$ with $\mathrm{aCMA}$ and a key exposure oracle.'
      note: 'The compiler keeps a master key in a protected environment and uses it to authenticate a temporary verification key together with the Merkle root of the messages this key may sign.'
    - id: 'thm:wrappers-closure'
      name: 'Theorem (Composition of the Security Compilers)'
      statement: 'Let $\Sigma$ be $\mathsf{sg}$-$\mathrm{aCMA}$-secure for an unforgeability goal $\mathsf{sg}\in\{\mathrm{UUF},\mathrm{wSUF},\mathrm{sSUF},\mathrm{wEUF},\mathrm{sEUF}\}$, and let the assumptions of the two compiler theorems hold. Then $\mathsf{GenTsk}(\mathsf{GenTr}(\Sigma))$, where every temporary key carries its own PRF key, and $\mathsf{GenTr}(\mathsf{GenTsk}(\Sigma))$, where the PRF key is part of the master key and the PRF input is the complete public input of the temporary signing computation, satisfy $\mathsf{sg}$ with $\mathrm{UKE}$ under $(\mathrm{aCMA},\mathrm{aCRA},L_{\mathsf{tsk}})$.'
      note: 'Here, the randomness choice applies to the external randomness of the temporary signing computation, while the setup of temporary keys runs in the trusted environment with honest randomness.'

additional:
  title: 'Additional Relations'
  lead: 'These results give relations between the security definitions that the component-wise order of Theorem (Security Definition Relations) does not capture. For a goal $g$ in a goal set, a scheme achieves $g$ within $(\mathsf{sg},u,\mathsf{am})$ if the probability that the experiment returns $1$ with $\widehat{\mathsf{sg}}=g$ is negligible for every $\mathsf{PPT}$ adversary.'
  theorems:
    - id: 'ex:nr-sceo'
      name: 'Example (Non-resignability and conservative exclusive ownership)'
      statement: 'Fix $\mathsf{am}=(\mathrm{KOA},\mathrm{KRA},\emptyset)$, where the signing oracle hides the message it signs and hands out the randomness, and let $\mathcal{D}_M$ be an admissible sampler for $\mathrm{NR}$. Then $\mathrm{NR}\rightarrow\mathrm{sCEO}$ holds: an $\mathrm{NR}$ adversary guesses one of the $q$ signing queries of an $\mathrm{sCEO}$ adversary, answers it with its own challenge $(\sigma,r)$, and forwards the other queries to its signing oracle.'
      note: 'If the $\mathrm{sCEO}$ break reuses the guessed signature under a key $\mathsf{pk}^*\neq\mathsf{pk}$, then $(\mathsf{pk}^*,\sigma)$ breaks $\mathrm{NR}$, at the cost of a factor $q$.'
    - id: 'prop:ar-model-independence'
      name: 'Proposition (Independence of the adversary model)'
      statement: 'Let $\Sigma$ be a signature scheme, possibly with the compilers $\mathsf{GenTr}$ and $\mathsf{GenTsk}$, and let $g\in\{\mathrm{msUEO},\mathrm{MB}\}$. For every goal set $\mathsf{sg}$ with $g\in\mathsf{sg}$, every restriction $u$, every adversary model $\mathsf{am}$, and every $\mathsf{PPT}$ adversary $\mathcal{A}$, there is a $\mathsf{PPT}$ adversary $\mathcal{B}$ such that $\mathsf{Adv}^{g}_{\Sigma}(\mathcal{B};\mathsf{sg}'',u'',(\mathrm{KO},\mathrm{KO},\emptyset))\geq\mathsf{Adv}^{g}_{\Sigma}(\mathcal{A};\mathsf{sg},u,\mathsf{am})$ for every goal set $\mathsf{sg}''$ with $g\in\mathsf{sg}''$ and every restriction $u''$.'
      note: 'The winning conditions of $\mathrm{msUEO}$ and $\mathrm{MB}$ refer only to public keys, messages, and a signature that the adversary outputs. An adversary against these goals can therefore run the whole experiment itself.'
    - id: 'cor:ar-model-independence'
      name: 'Corollary'
      statement: 'Let $g\in\{\mathrm{msUEO},\mathrm{MB}\}$. A scheme achieves $g$ under one pair of restriction and adversary model if and only if it achieves $g$ under every such pair. Two schemes with the same verification algorithm achieve $g$ under the same adversary models. If a scheme achieves $\mathrm{msUEO}$ under some adversary model, then it achieves $\mathrm{sUEO}$, $\mathrm{sCEO}$, $\mathrm{sDEO}$, $\mathrm{wUEO}$, $\mathrm{wCEO}$, and $\mathrm{wDEO}$ under every adversary model. Under the assumptions of the BUFF transform, the schemes $T(\Sigma)$ and $\mathsf{GenTr}(T(\Sigma))$ achieve $\mathrm{msUEO}$ and $\mathrm{MB}$, and hence these six goals, under every adversary model, including key exposure.'
      note: 'This gives implications that Theorem (Security Definition Relations) does not generate. For example, $\mathrm{msUEO}$ under $(\mathrm{KO},\mathrm{KO},\emptyset)$ implies $\mathrm{sUEO}$ under $(\mathrm{aCMA},\mathrm{aCRA},\{L_{\mathsf{tsk}}\})$.'
    - id: 'prop:ar-queue-eo'
      name: 'Proposition (Queue-based exclusive ownership and known randomness)'
      statement: 'Assume that a signature scheme exists that achieves $\mathrm{wEUF}$ and $\mathrm{sUEO}$ under $(\mathrm{aCMA},\mathrm{KO},\emptyset)$. Then there is a signature scheme that achieves $\mathrm{sUEO}$, and hence $\mathrm{sCEO}$ and $\mathrm{sDEO}$, under $(\mathrm{aCMA},\mathrm{KO},\emptyset)$, but does not achieve $\mathrm{sCEO}$, and hence not $\mathrm{sUEO}$, under $(\mathrm{aCMA},\mathrm{KRA},\emptyset)$.'
      note: 'The conservative, destructive, and universal variants of exclusive ownership differ from $\mathrm{msUEO}$, because their winning conditions require an honest signature from the queue.'
    - id: 'prop:ar-joint'
      name: 'Proposition (Choice of both inputs)'
      statement: 'Assume that a deterministic signature scheme with messages and external randomness in $\{0,1\}^{\lambda}$ exists that achieves $\mathrm{wEUF}$ under $(\mathrm{aCMA},\mathrm{KO},\emptyset)$, and let $\Sigma$ be the scheme of the remark on joint security with $\mathcal{D}_M$ and $\mathcal{D}_R$ uniform on $\{0,1\}^{\lambda}$. For every message choice $\mathsf{mc}$ and randomness choice $\mathsf{rc}$, the scheme $\Sigma$ achieves $\mathrm{wEUF}$ under $(\mathsf{mc},\mathsf{rc},\emptyset)$ if $\mathsf{mc}\in\{\mathrm{KO},\mathrm{KMA}\}$ or $\mathsf{rc}\in\{\mathrm{KO},\mathrm{KRA}\}$. If $\mathsf{mc}\in\{\mathrm{gCMA},\mathrm{dCMA},\mathrm{aCMA}\}$ and $\mathsf{rc}\in\{\mathrm{gCRA},\mathrm{dCRA},\mathrm{aCRA}\}$, then $\Sigma$ does not achieve $\mathrm{UB}$ under $(\mathsf{mc},\mathsf{rc},\emptyset)$ and hence no unforgeability goal.'
      note: 'The remark on joint security separates joint from separate choice of the message and the randomness. The same scheme shows exactly which combinations of the two attack vectors it withstands.'
    - id: 'prop:ar-incomparable'
      name: 'Proposition (Incomparable message and randomness choices)'
      statement: 'If a signature scheme exists that achieves $\mathrm{sEUF}$ under $(\mathrm{aCMA},\mathrm{KO},\emptyset)$, then there is a signature scheme that achieves $\mathrm{sEUF}$ under $(\mathrm{aCMA},\mathrm{KO},\emptyset)$ but does not achieve $\mathrm{UB}$ under $(\mathrm{KO},\mathrm{KRA},\emptyset)$. In the random oracle model, let $\mathcal{D}_M$ be uniform on $\{0,1\}^{\lambda}$. If a deterministic signature scheme exists that achieves $\mathrm{sEUF}$ under $(\mathrm{aCMA},\mathrm{KO},\emptyset)$, then there is a signature scheme that achieves $\mathrm{sEUF}$ under $(\mathrm{KO},\mathrm{aCRA},\emptyset)$ but does not achieve $\mathrm{UB}$ under $(\mathrm{KMA},\mathrm{KO},\emptyset)$.'
      note: 'Consequently, for every unforgeability goal $g$, every $\mathsf{mc}\in\{\mathrm{KMA},\mathrm{gCMA},\mathrm{dCMA},\mathrm{aCMA}\}$, and every $\mathsf{rc}\in\{\mathrm{KRA},\mathrm{gCRA},\mathrm{dCRA},\mathrm{aCRA}\}$, $(g,(\mathsf{mc},\mathrm{KO},\emptyset))$ does not imply $(g,(\mathrm{KO},\mathsf{rc},\emptyset))$, and in the random oracle model, $(g,(\mathrm{KO},\mathsf{rc},\emptyset))$ does not imply $(g,(\mathsf{mc},\mathrm{KO},\emptyset))$.'
    - id: 'prop:ar-nr-oracle'
      name: 'Proposition (Randomness of other signatures)'
      statement: 'Let $F\colon\{0,1\}^{\lambda}\times\{0,1\}^{\lambda}\to\{0,1\}^{n}$ be a pseudorandom function, and let $\Sigma$ achieve $\mathrm{NR}$ under $(\mathrm{aCMA},\mathrm{KO},\emptyset)$ for a sampler $\mathcal{D}$ with messages in $\{0,1\}^{n}$. Then there is a signature scheme $\Sigma''$ that achieves $\mathrm{NR}$ under $(\mathsf{mc},\mathrm{KO},\emptyset)$ for every message choice $\mathsf{mc}$ and the same sampler, but achieves $\mathrm{NR}$ under $(\mathsf{mc},\mathrm{KRA},\emptyset)$ for no message choice $\mathsf{mc}$.'
      note: 'The attack against $\Sigma''$ uses the randomness of one answer of the signing oracle and not the randomness of the challenge signature.'
    - id: 'prop:ar-nr-hidden'
      name: 'Proposition (Non-resignability and hidden messages)'
      statement: 'Let $\mathsf{am}=(\mathrm{KO},\mathrm{KRA},\emptyset)$, and let $\mathcal{D}_M$ satisfy the requirements on the sampler of $\mathrm{NR}$ with empty auxiliary data. Let $\Sigma$ achieve $\mathrm{NR}$ under $\mathsf{am}$ for the sampler that outputs $m\leftarrow\mathcal{D}_M$ and empty auxiliary data. If $\Sigma$ achieves $\mathrm{wEUF}$ under $\mathsf{am}$, then it achieves $\mathrm{sEUF}$ under $\mathsf{am}$. For every goal set $\mathsf{sg}$ with $\mathrm{NR}\notin\mathsf{sg}$ and every restriction $u$, if $\Sigma$ is $(\mathsf{sg},u)$-secure under $\mathsf{am}$, then it is $(\mathsf{sg},u)$-secure under $(\mathrm{KO},\mathrm{KRA},\{L_{\mathsf{tsk}}\})$.'
      note: 'If the signing oracle hides the signed messages, an adversary that uses one of these messages also breaks non-resignability.'
    - id: 'prop:ar-nr-sets-acm'
      name: 'Proposition (Adding non-resignability under adaptive message choice)'
      statement: 'Let $\mathsf{am}=(\mathrm{aCMA},\mathsf{rc},\mathbb{L})$ for arbitrary $\mathsf{rc}$ and $\mathbb{L}$, let $\mathsf{sg}$ be a goal set with $\mathrm{NR}\notin\mathsf{sg}$, let $g\in\mathsf{sg}$, and let $u$ be a restriction. For chosen randomness, the challenge signature takes the first element of $R$, and we assume that the signing oracles for direct and generic randomness choice take the elements of $R$ in the same order. For every $\mathsf{PPT}$ adversary $\mathcal{A}$ with $q$ signing queries and $q_L$ leakage queries, there are $\mathsf{PPT}$ adversaries $\mathcal{B}_1$ and $\mathcal{B}_2$ such that $\mathsf{Adv}^{g}_{\Sigma}(\mathcal{A};\mathsf{sg}\cup\{\mathrm{NR}\},u,\mathsf{am})\leq\mathsf{Adv}^{g}_{\Sigma}(\mathcal{B}_1;\mathsf{sg},u,\mathsf{am})+(q+q_L+3)\cdot\mathsf{Adv}^{\mathrm{NR}}_{\Sigma}(\mathcal{B}_2;\mathsf{sg}\cup\{\mathrm{NR}\},u,\mathsf{am})+\mathsf{negl}$.'
      note: 'The adversary receives the challenge signature for every $\widehat{\mathsf{sg}}$, and it does not enter the queue. Adding $\mathrm{NR}$ to a goal set therefore gives the adversary one additional signature for every other goal in the set.'
    - id: 'prop:ar-nr-sets-sep'
      name: 'Proposition (Adding non-resignability without adaptive message choice)'
      statement: 'Assume that a signature scheme exists that achieves $\mathrm{sEUF}$ under $(\mathrm{aCMA},\mathrm{KO},\emptyset)$. In the random oracle model, there are a signature scheme $\Sigma$ and an admissible sampler $\mathcal{D}$ for $\mathrm{NR}$ such that for every $\mathsf{mc}\in\{\mathrm{KO},\mathrm{KMA},\mathrm{gCMA}\}$ and $\mathsf{am}=(\mathsf{mc},\mathrm{KO},\emptyset)$, with this sampler, $\Sigma$ achieves $\mathrm{UB}$ within $(\{\mathrm{UB}\},\emptyset,\mathsf{am})$ and $\mathrm{NR}$ within $(\{\mathrm{UB},\mathrm{NR}\},\emptyset,\mathsf{am})$, but does not achieve $\mathrm{UB}$ within $(\{\mathrm{UB},\mathrm{NR}\},\emptyset,\mathsf{am})$.'
      note: 'For $\mathsf{mc}\in\{\mathrm{KO},\mathrm{KMA},\mathrm{gCMA}\}$, the adversary cannot obtain a signature on a message that depends on $\mathsf{pk}$, and the challenge signature can then break another goal.'
    - id: 'prop:ar-nr-sets-ssuf'
      name: 'Proposition (Selective unforgeability under key-only attacks)'
      statement: 'Assume that a signature scheme exists that achieves $\mathrm{wEUF}$ under $(\mathrm{aCMA},\mathrm{KO},\emptyset)$. In the random oracle model, there are a signature scheme and an admissible sampler for $\mathrm{NR}$ such that, with this sampler, the scheme achieves $\mathrm{sSUF}$ and $\mathrm{NR}$ within $(\{\mathrm{sSUF},\mathrm{NR}\},\emptyset,(\mathrm{KO},\mathrm{KO},\emptyset))$ but does not achieve $\mathrm{wEUF}$ within $(\{\mathrm{wEUF},\mathrm{NR}\},\emptyset,(\mathrm{KO},\mathrm{KO},\emptyset))$.'
      note: 'Without $\mathrm{NR}$, the adversary receives no signature, and the three goals describe the same experiment. With $\mathrm{NR}$, the adversary commits to its $\mathrm{sSUF}$ target before it receives the challenge signature.'

selection:
  title: 'Selected composed notion'
  implies: 'Implies'
  notImplies: 'Not implied by the displayed rule'
  koaNote: 'For $\mathsf{mc}=\mathsf{rc}=\mathrm{KO}$, the queue stays empty. Then $\mathrm{sEUF}$ and $\mathrm{wEUF}$ describe the same experiment, none of the queue-based exclusive-ownership goals can be broken, and there is no temporary key that the adversary could leak. If additionally $\mathrm{NR}\notin\mathsf{sg}$, the adversary receives no signature at all, and $\mathrm{sSUF}$ describes the same experiment as well.'
  koaNrNote: 'If $\mathrm{NR}\in\mathsf{sg}$, the adversary receives the challenge signature after it has committed to its $\mathrm{sSUF}$ target, so we do not identify $\mathrm{sSUF}$ with the other two goals in this case.'
  ukeNote: 'UKE is kept in the generated definition but omitted from the relation graph because it only restricts a candidate output by which the adversary wins and adds the straightforward order $\emptyset\rightarrow\mathrm{UKE}$.'
  modelFreeNote: 'The winning conditions of $\mathrm{msUEO}$ and $\mathrm{MB}$ involve neither the honest key pair nor the queue. An adversary against one of these goals can therefore generate a key pair itself and simulate the entire experiment, so the security of these two goals does not depend on the adversary model.'
  nrSetNote: 'Goal sets that contain $\mathrm{NR}$ and another goal $g$ behave differently, because the adversary receives the challenge signature $\mathsf{cs}_R$ for every $\widehat{\mathsf{sg}}$.'
  hiddenNote: 'Under $(\mathrm{KO},\mathrm{KRA},\emptyset)$, the signing oracle hides the message it signs and hands out the randomness. If $\mathcal{D}_M$ is an admissible sampler for $\mathrm{NR}$, then $\mathrm{NR}\rightarrow\mathrm{sCEO}$ holds, and a scheme that achieves $\mathrm{NR}$ and $\mathrm{wEUF}$ achieves $\mathrm{sEUF}$.'
  setRule: 'A selected set implies every goal in its closure. Adding an independent goal makes the definition stronger; removing one makes it weaker.'
  chainNote: 'All of them are basically trivial: a stronger value simulates every weaker one, with all other components fixed.'
  noStrongerNote: 'No further implication follows from the displayed component-wise rule; the extended classification is not exhaustive.'
