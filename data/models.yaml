classicalModels:
  - key: koa
    acronym: KOA
    short: koa
    label: Key Only Attack
    definition: 'Adversary $\mathcal{A}$ has access to the public key $\mathsf{pk}$.'
    figureDetail: 'No active message attack is shown.'
  - key: kma
    acronym: KMA
    short: kma
    label: Known Message Attack
    definition: 'Adversary $\mathcal{A}$ obtains $q$ message signature pairs $(m_i,\sigma_i)$, with (uniformly) randomly sampled $m_i \gets_\$ \mathcal{D}_M$ for $1 \leq i \leq q$.'
    figureDetail: 'The adversary only sees signatures on sampled messages.'
  - key: gcma
    acronym: gCMA
    short: gcma
    label: Generic Chosen Message Attack
    definition: 'Adversary $\mathcal{A}$ chooses a set of messages *before* accessing $\mathsf{pk}$ and before accessing the signatures.'
    figureDetail: 'The adversary fixes a set of messages in advance, before seeing the public key.'
  - key: dcma
    acronym: dCMA
    short: dcma
    label: Direct Chosen Message Attack
    definition: 'Adversary $\mathcal{A}$ chooses a set of messages *after* accessing $\mathsf{pk}$ and before accessing the signatures.'
    figureDetail: 'The adversary fixes a set of messages after seeing the public key.'
  - key: acma
    acronym: aCMA
    short: acma
    label: Adaptive Chosen Message Attack
    definition: '$\mathcal{A}$ can repeatedly access a signature oracle for adaptively chosen messages. In particular, $\mathcal{A}$ knows all queued message signature pairs and $\mathsf{pk}$ during this process.'
    figureDetail: 'The adversary can choose messages adaptively.'

